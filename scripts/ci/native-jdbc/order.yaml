dsl_version: v0.3
test_case_id: JDBC-NATIVE-ORDER
title: Verify a run-owned order against a native database

setup:
  - id: seed_order
    target: order_db
    op: db_seed
    with:
      sql_ref: artifact://fixtures/seed_order.sql
      params.order_id: NATIVE-ORDER-ID
      params.status: CREATED

execute:
  - id: query_order
    target: order_db
    op: db_query
    with:
      query_ref: artifact://queries/find_order_by_id.sql
      params.order_id: NATIVE-ORDER-ID

verify:
  - id: order_exists
    type: provider_check
    target: order_db
    op: db_record_exists
    with:
      query_ref: artifact://queries/find_order_by_id.sql
      params.order_id: NATIVE-ORDER-ID
      expected.row_count: 1
  - id: one_order_found
    type: assertion
    assert:
      actual: step://query_order/row_count
      operator: equals
      expected: 1

cleanup:
  - id: cleanup_order
    target: order_db
    op: db_cleanup
    with:
      sql_ref: artifact://fixtures/cleanup_order.sql
      params.order_id: NATIVE-ORDER-ID

{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:regress:runner_bundle.v1.schema.yaml",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "classification",
    "files",
    "lock_sha256",
    "lock_version"
  ],
  "properties": {
    "schema_version": {
      "const": "runner-bundle.v1"
    },
    "classification": {
      "const": "derived_execution_snapshot"
    },
    "files": {
      "type": "array",
      "minItems": 1,
      "maxItems": 128,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "bytes",
          "sha256",
          "source_repo",
          "source_commit",
          "source_path",
          "artifact_id",
          "role",
          "source_id",
          "source_testrepo_version"
        ],
        "properties": {
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "bytes": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2097152
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "source_repo": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "source_commit": {
            "type": "string",
            "pattern": "^[a-f0-9]{40}$"
          },
          "source_path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          },
          "artifact_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2048
          },
          "role": {
            "enum": [
              "suite",
              "case",
              "config_template",
              "sanitized_data",
              "oracle",
              "cleanup_definition",
              "provider_contract"
            ]
          },
          "source_id": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.-]{1,128}$"
          },
          "source_testrepo_version": {
            "type": "string",
            "pattern": "^[a-f0-9]{40}$"
          }
        }
      }
    },
    "lock_sha256": {
      "type": "string",
      "pattern": "^[a-f0-9]{64}$"
    },
    "lock_version": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512
    }
  }
}

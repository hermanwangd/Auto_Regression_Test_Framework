  "$id": "urn:regress:shared_sit_data.v1.schema.yaml",
  "$comment": "Metadata contract only; raw UTF-8 JSON <=65536 bytes, strict duplicates/depth/unknown fields. Externally expected raw SHA, never a self hash. Artifacts join actual admitted D2 qualified IDs/hashes and roles: data=sanitized_data; schema/config=config_template; oracle=oracle; cleanup=cleanup_definition. At least DATA_VERSION/SCHEMA_VERSION/AUTH and each SUT precondition required by validator. No executable dispatch or credential/token fields. Idempotency output only: SHA256(UTF8(shared-sit-data.idempotency.v1\\n) || canonical JSON {contract,source,run}); canonical rules in docs/02-architecture/contracts/shared_sit_data.v1.interface.md. Shared acceptance is always BLOCKED_NO_SHARED_OWNERSHIP_OR_PRECLEANUP_SAVE_BINDING in StageA; control contract source owner UNBOUND. StageA canonical identity-only profile: raw<=4MiB, depth<=64, string<=1MiB, field-name<=128. Accepted modern8MiB/depth100 or legal approximately6MiB escaped gRPC may be outside this profile and return canonicalIdentityINVALID/acceptanceBLOCKED_PRECONDITIONS; this does not invalidate or rewrite the original framework canonical verdict. No EHS semantic validation, effect gate, persistent shared lease or shared SIT PASS."

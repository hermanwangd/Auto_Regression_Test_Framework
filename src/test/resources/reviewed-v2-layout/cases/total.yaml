dsl_version: v0.3
test_case_id: P2-TOTAL-1
title: Independently frozen total of the public 5 and 7 values
execute:
  - id: total
    target: public_api
    op: http_request
    with:
      request.method: GET
      request.path: /total
      request.timeout: PT3S
verify:
  - id: status
    type: assertion
    assert:
      actual: step://total/response.status
      operator: equals
      expected: 200
  - id: total_oracle
    type: assertion
    assert:
      actual: step://total/response.body
      operator: json_match
      expected_ref: artifact://expected_results/independent-oracle.json

name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
      - 'codex/release-*'
      - plug-in-module

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cli:
    name: Windows native CLI
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MAVEN_OPTS: -Xmx768m -XX:MaxMetaspaceSize=320m
    steps:
      - name: Preserve byte-pinned sample sources on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify JUnit input handling on Windows
        run: python -B samples/90-compatibility/test_junit_readers.py
      - name: Verify Python virtual-environment launch on Windows
        run: python -B samples/90-compatibility/test_sample_launchers.py

      - name: Verify Windows executable pinning and the native provider
        shell: bash
        run: ./mvnw -B -ntp "-Dtest=PinnedCliExecutableTest,CliProcessProviderRuntimeTest#suppliesImmediateEofWhenStdinIsOmitted" test

  framework-gates:
    name: Framework Gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MAVEN_OPTS: -Xmx1536m
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Unit, integration, and packaged CLI verification
        run: scripts/ci/maven-verify-with-diagnostics.sh

      - name: Verify packaged CLI against native MariaDB
        run: scripts/ci/verify-native-mariadb.sh

      - name: Verify packaged MongoDB, Redis and S3 samples against native services
        run: scripts/ci/verify-native-datastores.sh

      - name: Verify WebSocket subscription and correlated events
        run: scripts/ci/verify-native-websocket.sh

      - name: Verify SMTP recovery mail in Mailpit
        run: scripts/ci/verify-mailpit-flow.sh

      - name: Verify SFTP batch and reconciliation with OpenSSH
        run: scripts/ci/verify-native-sftp.sh

      - name: Verify order submission in Chromium with Playwright
        shell: bash
        run: |
          node_dist=node-v24.22.3-linux-x64
          curl -fsSL --retry 3 "https://nodejs.org/dist/v24.22.3/$node_dist.tar.xz" -o "$RUNNER_TEMP/node.tar.xz"
          echo "4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$node_dist/bin:$PATH"
          export UI_NODE="$RUNNER_TEMP/$node_dist/bin/node"
          UI_NODE_SHA256=$(sha256sum "$UI_NODE" | cut -d' ' -f1)
          export UI_NODE_SHA256
          mkdir -p target/playwright-tools
          cp samples/20-provider-capability-p0/ui/playwright/package{,-lock}.json target/playwright-tools/
          npm ci --ignore-scripts --prefix target/playwright-tools
          target/playwright-tools/node_modules/.bin/playwright-core install --with-deps --no-shell chromium
          UI_CHROMIUM=$(cd target/playwright-tools && node -p "require('playwright-core').chromium.executablePath()")
          export UI_CHROMIUM
          scripts/ci/verify-playwright-flow.sh

      - name: Retain Playwright results and failure trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-flow-evidence
          if-no-files-found: ignore
          path: |
            target/playwright-runs/**/result.json
            target/playwright-runs/**/provider-evidence/cli_process/*.json
            target/playwright-runs/**/failure-trace.zip

      - name: Verify portable packaging and Linux process supervision
        run: |
          python3 -B -m unittest discover -s packaging/portable-runner/tests
          python3 -B -m unittest discover -s packaging/portable-runner/deployment/tests

      - name: Verify compatibility runner process and JUnit report handling
        run: |
          python3 -B -m unittest discover -s samples/90-compatibility/kimi-db-validation/fix1 -p test_process_policy.py
          python3 -B samples/90-compatibility/test_junit_readers.py
          python3 -B samples/90-compatibility/test_sample_launchers.py

      - name: Critical delivery coverage gate
        run: ./mvnw -B -ntp -Pv02-delivery-coverage -DskipTests jacoco:check@v02-delivery-critical-class-check

      - name: Schema contract drift
        run: scripts/ci/check-schema-drift.sh

      - name: Contract and evidence consistency
        run: scripts/ci/verify-contracts.sh

      - name: Public provider support contract
        run: scripts/ci/check-public-support-contract.sh

      - name: Security scanner regression tests and secret scan
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p test_secret_scan.py -v
          python3 -m unittest discover -s scripts/ci/tests -p test_dependency_scan.py -v
          scripts/ci/secret-scan.sh

      - name: Generate SBOM
        run: scripts/ci/generate-sbom.sh

      - name: Upload verification artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: framework-verification-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/bom.json
            target/bom.xml
          if-no-files-found: ignore

  dependency-security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAVEN_OPTS: -Xmx1536m
      DEPENDENCY_CHECK_VERSION: 12.2.2
      DEPENDENCY_CHECK_DATA_DIR: .dependency-check-data
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve Dependency-Check cache key date
        id: dependency-check-cache-date
        shell: bash
        run: echo "date=$(/bin/date -u '+%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Dependency-Check data
        id: dependency-check-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: ${{ runner.os }}-dependency-check-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ steps.dependency-check-cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-${{ env.DEPENDENCY_CHECK_VERSION }}-
            ${{ runner.os }}-dependency-check-

      - name: Warm Dependency-Check data
        if: steps.dependency-check-cache.outputs.cache-hit != 'true'
        timeout-minutes: 80
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: scripts/ci/security-scan.sh --warmup

      - name: Save warmed Dependency-Check data
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.dependency-check-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA_DIR }}
          key: ${{ runner.os }}-dependency-check-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ steps.dependency-check-cache-date.outputs.date }}

      - name: OWASP dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DEPENDENCY_CHECK_AUTO_UPDATE: false
        run: scripts/ci/security-scan.sh

      - name: Upload dependency scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-${{ github.run_id }}
          path: |
            target/dependency-check-report.*
          if-no-files-found: ignore

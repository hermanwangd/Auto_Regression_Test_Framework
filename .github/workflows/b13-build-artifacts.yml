# A01 fixture compilation only; never starts a service or changes production.
name: A01 nonproduction fixture build
on:
  push:
    branches: [codex/b13-build-only]
permissions:
  contents: read
concurrency:
  group: b13-artifact-build-only
  cancel-in-progress: false
jobs:
  fixture-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed control package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hermanwangd/Auto_Regression_Test_Framework
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/b13-build/
            /.github/workflows/b13-build-artifacts.yml
      - name: Build pinned Go fixture without running it
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '28235510558d9c8dfa9bbbaf3984f7288b7ecbfeb394123454db1b72b4aed2a2' 'control/scripts/ci/b13-build/a01_build.py' | sha256sum --check --strict
          printf '%s  %s\n' '27e39f176a955390cf8e492318a36ea577a8f1759f1dbd9d0ea9c508e443667b' 'control/scripts/ci/b13-build/build_driver.py' | sha256sum --check --strict
          printf '%s  %s\n' '2bc8bf49c6a7c1d53d6b339c920e748b261067512684e32ed1201b42db324a55' 'control/scripts/ci/b13-build/a01-build-contract.json' | sha256sum --check --strict
          python3 -I -B control/scripts/ci/b13-build/a01_build.py \
            --control "$GITHUB_WORKSPACE/control" \
            --work "$RUNNER_TEMP/a01-fixture-build" --workflow-commit "$GITHUB_SHA"
      - name: Retain exactly four fixture outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a01-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/a01-fixture-build/delivery/productcatalogservice
            ${{ runner.temp }}/a01-fixture-build/delivery/products.json
            ${{ runner.temp }}/a01-fixture-build/delivery/fixtures/catalog.desc.b64
            ${{ runner.temp }}/a01-fixture-build/delivery/build-manifest.json
